<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SignalCheck">
  <title>SignalCheck</title>
  <!--
    SignalCheck mark — small variant, for 16px and 32px.
    The six-vertex pulse of the master mark collapses into a smear below 48px,
    so this variant drops to four vertices with a heavier stroke and pulls the
    baseline tails in. Same shield, same palette, same idea — optically
    corrected for the toolbar. This is deliberate, not a different logo.
  -->
  <defs>
    <linearGradient id="sc-shield-s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <clipPath id="sc-clip-s">
      <path d="M 40 0 H 472 A 40 40 0 0 1 512 40 V 272
               C 512 388 420 470 256 512
               C 92 470 0 388 0 272 V 40
               A 40 40 0 0 1 40 0 Z"/>
    </clipPath>
  </defs>

  <path d="M 40 0 H 472 A 40 40 0 0 1 512 40 V 272
           C 512 388 420 470 256 512
           C 92 470 0 388 0 272 V 40
           A 40 40 0 0 1 40 0 Z"
        fill="url(#sc-shield-s)"/>

  <g clip-path="url(#sc-clip-s)" fill="none" stroke-width="64"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 128 252 L 196 252 L 250 348 L 322 152 L 356 202" stroke="#FFFFFF"/>
    <path d="M 356 202 L 384 252" stroke="#22D3EE"/>
  </g>
</svg>
