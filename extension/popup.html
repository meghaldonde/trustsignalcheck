<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
      color: #333;
    }
    #scanBtn {
      width: 100%;
      padding: 12px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    #scanBtn:hover {
      background: #3367d6;
    }
    #scanBtn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #result {
      margin-top: 16px;
    }
    .score-container {
      text-align: center;
      padding: 16px;
      background: #f5f5f5;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .trust-score {
      font-size: 48px;
      font-weight: bold;
    }
    .score-high { color: #34a853; }
    .score-medium { color: #fbbc04; }
    .score-low { color: #ea4335; }
    .details {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }
    .details p {
      margin: 4px 0;
    }
    .error {
      color: #ea4335;
      padding: 12px;
      background: #fce8e6;
      border-radius: 6px;
    }
    .signals {
      margin-top: 8px;
      padding-left: 16px;
    }
    .signals li {
      margin: 2px 0;
    }
    .rate-limit {
      text-align: center;
      padding: 20px;
      background: #fff3e0;
      border-radius: 8px;
      border: 1px solid #ffcc80;
    }
    .rate-limit-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .rate-limit-title {
      font-size: 16px;
      font-weight: bold;
      color: #e65100;
      margin-bottom: 8px;
    }
    .rate-limit-message {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }
    .rate-limit-hint {
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <h1>SignalCheck</h1>
  <button id="scanBtn">Scan Page</button>
  <div id="result"></div>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
